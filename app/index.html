<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gringa Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --brand:#7C3AED; --brand-2:#6D28D9; --tint:#F5F3FF; --soft:#EDE9FE;
    --ink:#1A1A1E; --ink-2:#4B5563; --ink-3:#8A93A0;
    --bg-2:#F7F8FA; --line:#E8EAEF;
    --up:#16A34A; --dn:#DC2626; --warn:#D97706;
    --f:"Inter",system-ui,-apple-system,sans-serif;
    --bg:#fff; --card:#fff;
  }
  html[data-tema="escuro"]{
    --brand:#9F75F0; --brand-2:#B794F6; --tint:#2A2140; --soft:#3D2E5C;
    --ink:#EDEDF2; --ink-2:#B8BDC7; --ink-3:#7C8291;
    --bg-2:#1C1D24; --line:#33353E;
    --bg:#111218; --card:#191A21;
  }
  html[data-tema="escuro"] body{background:var(--bg)}
  html[data-tema="escuro"] .card,html[data-tema="escuro"] .cbox{background:var(--card)}
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .15s,color .15s}
  button,input,select{font:inherit;color:inherit} button{cursor:pointer}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .hide{display:none!important}

  .gate{max-width:360px;margin:12vh auto;padding:0 20px;text-align:center}
  .gate h1{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:16px 0 6px}
  .gate p{color:var(--ink-2);margin:0 0 24px}
  .gate label{display:block;text-align:left;font-size:12.5px;font-weight:500;color:var(--ink-2);margin:14px 0 5px}
  .gate input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px}
  .gate input:focus{border-color:var(--brand)}
  .gate .btn{width:100%;margin-top:18px;padding:11px}
  .alt{margin-top:14px;font-size:13.5px;color:var(--ink-3)}
  .alt button{background:none;border:0;color:var(--brand);font-weight:500;padding:0}
  .msg{margin-top:14px;padding:10px 12px;border-radius:8px;font-size:13px;text-align:left}
  .msg.err{background:#FEF2F2;color:var(--dn)} .msg.ok{background:#F0FDF4;color:var(--up)}

  .strip{background:linear-gradient(90deg,#4C1D95,#7C3AED);color:#fff;padding:9px 16px;text-align:center;font-size:13.5px}
  .strip b{color:#FDE68A}
  .strip button{margin-left:12px;background:var(--card);color:var(--brand-2);border:0;border-radius:6px;padding:4px 12px;font-size:12.5px;font-weight:600}

  .shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
  .side{border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto}
  .brand{display:flex;align-items:center;gap:9px;padding:16px 18px}
  .brand .nm{font-weight:700;font-size:15px;letter-spacing:-.02em;display:block}
  .brand .nm em{color:var(--brand);font-style:normal}
  .brand .tg{display:block;font-size:9px;letter-spacing:.16em;color:var(--ink-3);font-weight:500;margin-top:1px}
  .grp{padding:2px 10px}
  .gh{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:9px 10px;border-radius:8px;color:var(--ink-2);font-size:14px;font-weight:500;text-align:left}
  .gh:hover{background:var(--bg-2)}
  .gh .ch{margin-left:auto;color:var(--ink-3);font-size:11px}
  .item{display:block;width:100%;background:none;border:0;text-align:left;padding:8px 10px 8px 40px;border-radius:8px;color:var(--ink-2);font-size:13.5px}
  .item:hover{background:var(--bg-2);color:var(--ink)}
  .item[aria-current=true]{background:var(--tint);color:var(--brand-2);font-weight:600}
  .solo{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:9px 10px;border-radius:8px;color:var(--ink-2);font-size:14px;font-weight:500;text-align:left}
  .solo:hover{background:var(--bg-2);color:var(--ink)}
  .solo[aria-current=true]{background:var(--tint);color:var(--brand-2);font-weight:600}
  .ic{width:18px;height:18px;flex:none}

  .main{min-width:0;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;gap:12px;padding:12px 26px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:9}
  .mkt{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:7px 13px;font-weight:500}
  .mkt .dot{width:18px;height:18px;border-radius:50%;background:#FFE600;display:grid;place-items:center;font-size:10px}
  .sp{flex:1}
  .lnk{background:none;border:0;color:var(--ink-2);font-size:13.5px;font-weight:500}
  .lnk:hover{color:var(--ink)}
  .up{background:var(--brand);color:#fff;border:0;border-radius:9px;padding:9px 17px;font-size:13.5px;font-weight:600}
  .up:hover{background:var(--brand-2)}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--tint);color:var(--brand-2);border:0;font-weight:600}
  .qbar{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:9px;padding:6px 12px;font-size:13px}
  .qbar .lb{color:var(--ink-3);font-size:12.5px} .qbar b{font-weight:600}
  .qbar.dry{border-color:#FECACA;background:#FEF2F2} .qbar.dry .lb{color:var(--dn)}
  .track{width:70px;height:6px;border-radius:99px;background:var(--line);overflow:hidden;display:inline-block;vertical-align:middle}
  .track u{display:block;height:100%;background:var(--brand);text-decoration:none}

  .wrap{padding:26px;max-width:1280px}
  .cols{display:grid;grid-template-columns:1fr 300px;gap:26px;align-items:start}
  h1.pg{font-size:26px;font-weight:700;letter-spacing:-.025em;margin:0 0 6px}
  .sub{color:var(--ink-2);margin:0 0 22px;font-size:14.5px}
  h2.sc{font-size:19px;font-weight:600;letter-spacing:-.015em;margin:28px 0 4px}
  .sc2{color:var(--ink-2);font-size:14px;margin:0 0 14px}

  .hero{background:linear-gradient(100deg,var(--brand),#9333EA);border-radius:14px;padding:24px 26px;color:#fff;position:relative;overflow:hidden}
  .hero h3{margin:0 0 7px;font-size:19px;font-weight:600}
  .hero p{margin:0 0 16px;opacity:.94;max-width:44ch}
  .hero .b{background:var(--card);color:var(--brand-2);border:0;border-radius:9px;padding:9px 17px;font-weight:600;font-size:13.5px}
  .hero .art{position:absolute;right:-24px;top:-24px;opacity:.16;pointer-events:none}

  .qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
  .qc{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:15px;background:var(--card);text-align:left}
  .qc:hover{border-color:var(--brand)}
  .sq{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none}
  .qc span{font-size:14px;font-weight:500}
  .rcard{border:1px solid var(--line);border-radius:12px;padding:14px 15px;margin-bottom:10px;display:flex;gap:11px;align-items:flex-start}
  .rcard .sq{width:30px;height:30px;border-radius:8px}
  .rcard b{display:block;font-size:13.5px;font-weight:600;margin-bottom:2px}
  .rcard p{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.45}

  .filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;padding:16px;border:1px solid var(--line);border-radius:12px;margin-bottom:16px}
  .fld label{display:block;font-size:12.5px;font-weight:500;color:var(--ink-2);margin-bottom:5px}
  .fld input,.fld select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13.5px}
  .fld input:focus,.fld select:focus{border-color:var(--brand)}
  .acts{display:flex;gap:8px;align-items:flex-end}
  .btn{background:var(--brand);color:#fff;border:0;border-radius:9px;padding:9px 18px;font-size:13.5px;font-weight:600}
  .btn:hover{background:var(--brand-2)} .btn[disabled]{opacity:.45;cursor:not-allowed}
  .btn.g{background:var(--card);color:var(--ink-2);border:1px solid var(--line)}
  .btn.g:hover{background:var(--bg-2);color:var(--ink)}

  .card{border:1px solid var(--line);border-radius:12px;overflow:hidden}
  table{width:100%;border-collapse:collapse}
  thead th{font-size:12px;font-weight:600;color:var(--ink-2);text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--bg-2);white-space:nowrap}
  thead th.n{text-align:right}
  tbody td{padding:12px 14px;border-bottom:1px solid var(--line)}
  tbody tr:last-child td{border-bottom:0}
  tbody tr.k{cursor:pointer} tbody tr.k:hover{background:var(--tint)}
  td.n{text-align:right;font-variant-numeric:tabular-nums}
  .nm{font-weight:500;line-height:1.35}
  .sb{font-size:12px;color:var(--ink-3);margin-top:2px}
  .pos{display:inline-grid;place-items:center;min-width:30px;height:26px;border-radius:7px;background:var(--tint);color:var(--brand-2);font-weight:600;font-size:13.5px;padding:0 7px}
  .mv{font-size:13px;font-weight:500} .mv.u{color:var(--up)} .mv.d{color:var(--dn)} .mv.f{color:var(--ink-3)}
  .chip{display:inline-block;font-size:11.5px;font-weight:500;border-radius:6px;padding:2px 8px;background:var(--bg-2);color:var(--ink-2);white-space:nowrap}
  .chip.g{background:#F0FDF4;color:var(--up)} .chip.y{background:#FFFBEB;color:var(--warn)}
  .chip.p{background:var(--tint);color:var(--brand-2)}

  .wall{padding:44px 26px;text-align:center;background:var(--bg-2)}
  .wall h3{font-size:17px;font-weight:600;margin:0 0 7px}
  .wall p{margin:0 auto 16px;max-width:46ch;color:var(--ink-2)}
  .none{padding:48px 22px;text-align:center;color:var(--ink-2)}
  .none b{display:block;font-size:15.5px;font-weight:600;color:var(--ink);margin-bottom:5px}
  .tip{margin-top:16px;border:1px solid var(--soft);background:var(--tint);border-radius:12px;padding:13px 15px;font-size:13.5px;color:#4C1D95}
  .tip b{font-weight:600}
  .load{padding:44px;text-align:center;color:var(--ink-3)}

  .g2{display:grid;grid-template-columns:1.45fr 1fr;gap:16px}
  .stat{padding:14px 16px;border-bottom:1px solid var(--line)}
  .stat:last-child{border-bottom:0}
  .stat .k{font-size:12.5px;color:var(--ink-2);font-weight:500}
  .stat .v{font-size:22px;font-weight:700;margin-top:3px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .cbox{padding:16px}
  .ct{font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:10px}
  .row{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0} .row span{color:var(--ink-2);font-size:13.5px}
  .row b{font-variant-numeric:tabular-nums;font-weight:500}
  .row.t{border-top:2px solid var(--ink);border-bottom:0;margin-top:6px;padding-top:11px}
  .row.t span{color:var(--ink);font-weight:600} .row.t b{font-size:19px;font-weight:700}

  /* calculadora de margem */
  .csec{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
  .csec>summary{list-style:none;cursor:pointer;padding:13px 15px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px}
  .csec>summary::-webkit-details-marker{display:none}
  .csec>summary::before{content:'▸';color:var(--ink-3);font-size:11px;transition:transform .15s}
  .csec[open]>summary::before{transform:rotate(90deg)}
  .csec .sub2{font-weight:400;font-size:12.5px;color:var(--ink-3);margin-left:auto;text-align:right}
  .cbody{padding:2px 15px 15px}
  .crow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
  .crow:last-child{margin-bottom:0}
  .cfld label{display:block;font-size:12px;font-weight:500;color:var(--ink-2);margin-bottom:4px}
  .cfld label i{font-weight:400;color:var(--ink-3);font-style:normal}
  .cfld input,.cfld select{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;background:var(--card)}
  .cfld input:focus,.cfld select:focus{border-color:var(--brand)}
  .cfld.chk{display:flex;align-items:center;gap:8px;flex-direction:row;padding-top:19px}
  .cfld.chk label{margin:0}
  .cwarn{display:flex;gap:8px;align-items:flex-start;background:#FFFBEB;border:1px solid #FDE68A;border-radius:10px;padding:11px 12px;font-size:12.5px;color:#92400E;margin-top:12px}
  .presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .preset{background:var(--tint);color:var(--brand-2);border:0;border-radius:20px;padding:5px 12px 5px 14px;font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
  .preset button{background:none;border:0;color:var(--brand-2);opacity:.6;font-size:13px;padding:0;line-height:1}
  .preset button:hover{opacity:1}
  .cdet .row span{font-size:13px} .cdet .grp{font-size:11.5px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.03em;margin:14px 0 2px}
  .cdet .grp:first-child{margin-top:2px}
  .radios{display:flex;gap:18px;padding:9px 0 3px}
  .radios label{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink);cursor:pointer;font-weight:400}
  .radios input{accent-color:var(--brand);width:16px;height:16px}
  .roval{padding:8px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg-2);color:var(--ink-2);font-size:13.5px;font-variant-numeric:tabular-nums}
  .crow3{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;margin-bottom:10px}
  .cattag{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .cattag input{flex:1;min-width:120px;padding:8px 9px;border:1px solid var(--line);border-radius:8px;font-size:13px}
  .hint{font-size:11.5px;color:var(--ink-3);margin-top:4px}
  .exgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px}
  .exgrid img,.exph{width:100%;aspect-ratio:1;border-radius:8px;object-fit:cover;background:var(--bg-2)}
  .exph{display:flex;align-items:center;justify-content:center;color:var(--ink-3);font-size:11px;border:1px dashed var(--line)}
  .exvideo{width:100%;aspect-ratio:16/9;border-radius:10px;margin-bottom:10px;background:#111;position:relative;overflow:hidden}
  .exvideo video,.exvideo img{width:100%;height:100%;object-fit:cover;display:block}
  .exvideo .exph{border-radius:10px;background:#1A1A1E;color:#8A93A0;border:0}
  .excap{font-size:12px;color:var(--ink-3);text-align:center;margin-bottom:14px}

  /* assistente */
  .assist{position:fixed;right:20px;bottom:20px;width:380px;max-height:70vh;background:var(--card);
    border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.18);
    display:flex;flex-direction:column;z-index:50}
  .assist.hide{display:none}
  .ahead{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .ahead b{font-size:14px}
  .ahead button{margin-left:auto;background:none;border:0;font-size:18px;color:var(--ink-3);line-height:1;padding:0}
  .amsgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:160px}
  .amsg{max-width:88%;padding:9px 12px;border-radius:12px;font-size:13.5px;line-height:1.45;white-space:pre-wrap}
  .amsg.user{align-self:flex-end;background:var(--brand);color:#fff}
  .amsg.ai{align-self:flex-start;background:var(--bg-2);color:var(--ink)}
  .amsg.ai.busy{color:var(--ink-3)}
  .amsg.erro{align-self:flex-start;background:#FEF2F2;color:var(--dn)}
  .ainput{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
  .ainput input{flex:1;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:13.5px}
  @media (max-width:640px){ .assist{right:10px;left:10px;width:auto;bottom:10px} }
  .neg{color:var(--dn)}

  .modo{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:18px}
  .mb{background:none;border:0;border-bottom:2px solid transparent;padding:10px 16px;font-size:14px;font-weight:500;color:var(--ink-3);margin-bottom:-1px}
  .mb:hover{color:var(--ink)}
  .mb.on{color:var(--brand-2);border-bottom-color:var(--brand);font-weight:600}
  .preds{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .pd{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:7px 14px;font-size:13px;font-weight:500;color:var(--ink-2)}
  .pd:hover{border-color:var(--brand);color:var(--brand-2)}
  .pd.on{background:var(--tint);border-color:var(--brand);color:var(--brand-2);font-weight:600}
  .fbox{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px}
  .fgrid{display:grid;grid-template-columns:1fr 1fr}
  .fcol{padding:18px 20px}
  .fcol+.fcol{border-left:1px solid var(--line)}
  .fh{font-size:14px;font-weight:600;margin:0 0 14px;display:flex;align-items:center;gap:8px}
  .fh .sq{width:26px;height:26px;border-radius:7px}
  .frow{margin-bottom:13px}
  .frow>label{display:block;font-size:12.5px;font-weight:500;color:var(--ink-2);margin-bottom:5px}
  .frow input,.frow select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;background:var(--card)}
  .frow input:focus,.frow select:focus{border-color:var(--brand)}
  .duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .catwrap{position:relative}
  .catdrop{position:absolute;top:100%;left:0;right:0;z-index:20;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.09);max-height:250px;overflow-y:auto;margin-top:3px}
  .catop{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 12px;font-size:13px;border-bottom:1px solid var(--line)}
  .catop:last-child{border-bottom:0}
  .catop:hover{background:var(--tint)}
  .catop b{display:block;font-weight:500}
  .catop span{font-size:11.5px;color:var(--ink-3)}
  .chosen{display:inline-flex;align-items:center;gap:7px;background:var(--tint);border:1px solid var(--soft);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--brand-2);font-weight:500}
  .chosen button{background:none;border:0;color:var(--brand-2);font-size:15px;line-height:1;padding:0}
  .catno{display:flex;align-items:center}
  .catarrow{flex:none;width:26px;height:30px;background:none;border:0;color:var(--ink-3);font-size:11px;cursor:pointer}
  .catarrow.folha{visibility:hidden}
  .catnome{flex:1;text-align:left;background:none;border:0;padding:7px 6px 7px 0;font-size:13px;border-bottom:1px solid var(--line)}
  .catnome:hover{background:var(--tint)}
  .catcarr{padding:9px 12px;font-size:12px;color:var(--ink-3)}
  .fbar{display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--bg-2);border-top:1px solid var(--line)}
  .fbar .cnt{font-size:13.5px;color:var(--ink-2)}
  .fbar .cnt b{color:var(--ink);font-weight:600}
  .fbar .sp{flex:1}
  .barra{display:flex;gap:0;border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-bottom:14px;background:var(--card)}
  .barra input{flex:1;border:0;padding:13px 16px;font-size:14px;outline:none}
  .barra button{border:0;background:var(--bg-2);border-left:1px solid var(--line);padding:0 18px;color:var(--ink-2);font-size:13.5px;font-weight:500}
  .barra button:hover{background:var(--tint);color:var(--brand-2)}
  .predl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
  .predl>span{font-size:13px;color:var(--ink-2);margin-right:2px}
  .fgrid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:16px}
  .fcard{border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:var(--card)}

function semSelect(campo){
  const c = SEM[campo], val = S.F[campo];
  const esc2 = c.opcoes.find(o=>o.v===val);
  const aberto = S.sel === campo;
  return `<div class="sem">
    <label>${c.obrig?'<i>*</i> ':''}${c.rot}</label>
    <button class="semb ${esc2?'':'vazio'}" data-sem="${campo}">${esc2?esc(esc2.t):'Selecionar'}</button>
    ${aberto?`<div class="semd">${c.opcoes.map(o=>
      `<button class="semo" data-sv="${campo}|${o.v}"><b>${esc(o.t)}</b><span>${esc(o.d)}</span></button>`
      ).join('')}</div>`:''}
  </div>`;
}

function chipsAtivos(){
  const F = S.F, out = [];
  const add = (t, k) => out.push(`<span class="fchip">${t}<button data-rmf="${k}">×</button></span>`);
  if (S.catSel)          add(`Categoria: ${esc(S.catSel.nome)}`, 'p_categoria');
  if (F.p_texto)         add(`Texto: ${esc(F.p_texto)}`, 'p_texto');
  if (F.p_pos_min||F.p_pos_max) add(`Posição ${F.p_pos_min??1}–${F.p_pos_max??20}`, 'pos');
  if (F.p_melhor_pos)    add(`Já foi top ${F.p_melhor_pos}`, 'p_melhor_pos');
  if (F.p_preco_min||F.p_preco_max) add(`Preço ${brl(F.p_preco_min??0)}–${F.p_preco_max?brl(F.p_preco_max):'∞'}`, 'preco');
  if (F.p_momentum)      add(`Movimento: ${esc(F.p_momentum)}`, 'p_momentum');
  if (F.p_delta_min)     add(`Subiu ${F.p_delta_min}+`, 'p_delta_min');
  if (F.p_consistencia)  add(`${esc(F.p_consistencia)}`, 'p_consistencia');
  if (F.p_conc_min||F.p_conc_max) add(`Concorrentes ${F.p_conc_min??0}–${F.p_conc_max??'∞'}`, 'conc');
  if (F.p_dispersao_min) add(`Dispersão ${pct(F.p_dispersao_min)}+`, 'p_dispersao_min');
  if (F.p_full_max)      add(`Full até ${pct(F.p_full_max)}`, 'p_full_max');
  return out;
}


/** Árvore de categorias, no estilo do JoomPulse: raízes abertas de cara,
 *  seta ▸ expande sem sair da posição. Folha não tem seta (nada abaixo). */
function catArvoreHtml(parentId, depth){
  const chave = parentId ?? '_raiz';
  const nos = S.catArvore[chave];
  if (!nos) return '<div class="catcarr">carregando…</div>';
  return nos.map(n => {
    const aberto = S.catAbertos.has(n.id);
    return `<div class="catno" style="padding-left:${depth*14}px">
      <button class="catarrow ${n.is_leaf?'folha':''}" data-toggle="${esc(n.id)}">${aberto?'▾':'▸'}</button>
      <button class="catnome" data-cid="${esc(n.id)}" data-cn="${esc(n.nome)}">${esc(n.nome)}</button>
    </div>${aberto?catArvoreHtml(n.id, depth+1):''}`;
  }).join('');
}

function tprod(){

  const livres = (lim?.unlimited || lim?.limit === -1) ? Infinity : (lim?.limit ?? 5);
  const per = S.periodo === '30' ? 'delta_30d' : 'delta_7d';

  const linhas = S.produtos.map((p,i)=>{
    const b = i >= livres ? 'blur' : '';
    const tr = i >= livres ? 'locked' : '';
    return `<tr class="k ${tr}" data-p="${esc(p.product_id)}">
      <td style="width:34px"><input type="checkbox" data-ck="${esc(p.product_id)}"

        ${p.picture?`<img class="thumb" src="${esc(p.picture)}" alt="" loading="lazy">`:`<span class="thumb"></span>`}

          ? 'Sem ficha pública — Mercado Livre bloqueia esse dado para terceiros'
          : p.product_id))}</div>
          <div class="sb">${esc(p.product_id)} · ${esc(p.category_name ?? '')}</div></div>
      </div></td>
      <td class="n">${p.position_now!=null?`<span class="pos" title="${esc(String(p.position_now))}° em ${esc(p.category_name??'—')}">${p.position_now}</span>`:'<span class="pos">—</span>'}</td>
      <td class="n ${b}"><span>${mov(p[per])}</span></td>
      <td class="n ${b}"><span>${p.days_in_top10 ?? '—'}/${p.days_observed ?? '—'}</span></td>
      <td class="n ${b}"><span>${num(p.listings)}</span></td>
      <td class="n ${b}"><span>${brl(p.median_price)}</span></td>
      <td class="n ${b}" style="font-size:13px;color:var(--ink-3)"><span>${
        p.min_price!=null?brl(p.min_price)+' – '+brl(p.max_price):'—'}</span></td>
      <td class="n ${b}"><span>${p.full_share!=null
        ?`<span class="chip ${p.full_share>=.5?'g':''}">${pct(p.full_share)}</span>`:'—'}</span></td>

        p.first_seen_at?num(Math.max(0,Math.floor((Date.now()-new Date(p.first_seen_at))/86400000)))+'d':'—'}</td>
    </tr>`;
  }).join('');

  const travadas = Math.max(0, S.produtos.length - livres);
  return `<table><thead><tr>

      <th class="n" title="Ha quanto tempo monitoramos, nao data real de criacao (ML nao publica)">Tempo no ar</th>
    </tr></thead><tbody>${linhas}</tbody></table>

}

function spark(v,w=560,h=110){
  if (!v.length) return '<div class="none">sem histórico ainda</div>';
  const mx=Math.max(...v), mn=Math.min(...v), rg=(mx-mn)||1;
  const p = v.map((x,i)=>[(i/Math.max(v.length-1,1))*w, ((x-mn)/rg)*(h-18)+9]);
  const d = p.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none"
    role="img" aria-label="Histórico de ${v.length} dias">
    <path d="${d} L ${w} ${h} L 0 ${h} Z" fill="#7C3AED" opacity=".08"/>
    <path d="${d}" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linejoin="round"/>
    ${p.map(q=>`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="2.6" fill="#7C3AED"/>`).join('')}</svg>`;
}

// Anexo I do Simples Nacional (comércio) — faixas oficiais, estáveis desde a
// LC 155/2016. Alíquota efetiva = ((RBT12 × alíquota nominal) − parcela a
// deduzir) / RBT12. É a única tabela de custo aqui calculada por fórmula:
// comissão do ML e tabela de frete variam por categoria/reputação de um jeito
// que muda sem aviso e sem fonte pública confiável pra travar em código —
// por isso ficam editáveis, com valor inicial só como ponto de partida.
const SIMPLES_ANEXO1 = [
  { ate: 180000,   aliq: .04,  pd: 0 },
  { ate: 360000,   aliq: .073, pd: 5940 },
  { ate: 720000,   aliq: .095, pd: 13860 },
  { ate: 1800000,  aliq: .107, pd: 22500 },
  { ate: 3600000,  aliq: .143, pd: 87300 },
  { ate: 4800000,  aliq: .19,  pd: 378000 },
];
function aliquotaSimples(rbt12){
  const r = Math.max(0, rbt12 || 0);
  const faixa = SIMPLES_ANEXO1.find(f => r <= f.ate) ?? SIMPLES_ANEXO1[SIMPLES_ANEXO1.length - 1];
  if (r <= 0) return faixa.aliq * 100;
  return Math.max(0, ((r * faixa.aliq) - faixa.pd) / r) * 100;
}

function calc(){
  const g = id => parseFloat(document.getElementById(id)?.value) || 0;
  const gi = id => document.getElementById(id)?.value;
  const checked = id => !!document.getElementById(id)?.checked;
  const radio = (name, fallback) => document.querySelector(`input[name=${name}]:checked`)?.value ?? fallback;

  const venda = g('pc_venda'), compra = g('pc_compra'), qtd = Math.max(0, g('pc_vendas'));
  const tipo = radio('pc_tipo', 'classico');
  let comissaoPct = g('pc_comissao');
  const taxaFixa = checked('pc_taxafixa') && venda > 0 && venda < 79 ? g('pc_taxafixa_v') : 0;

  const gratis = radio('pc_gratis', 'sim') === 'sim';
  const freteUn = gratis ? g('pc_frete') : 0;

  const regime = gi('pc_regime') || 'nenhum';
  let impostoPct = g('pc_imposto');
  if (regime === 'simples') impostoPct = aliquotaSimples(g('pc_receita'));

  const extra = g('pc_extra');

  const comissaoR = venda * comissaoPct / 100;
  const impostoR = venda * impostoPct / 100;
  const despesas = compra + comissaoR + taxaFixa + freteUn + impostoR + extra;
  const receitaBruta = venda;
  const lucro = receitaBruta - despesas;
  const margemLiquida = venda ? lucro / venda : null;
  const margemBruta = venda ? (venda - compra) / venda : null;

  // resumos nas abas fechadas, pra não precisar abrir tudo pra conferir
  const rc = $('#pc_com_resumo'); if (rc) rc.textContent = `${comissaoPct}%${taxaFixa?' + taxa fixa':''}`;
  const re = $('#pc_env_resumo'); if (re) re.textContent = gratis ? brl(freteUn) : 'frete pago pelo comprador';
  const ri = $('#pc_imp_resumo'); if (ri) ri.textContent = `${impostoPct.toFixed(2)}%`;
  const rx = $('#pc_extra_resumo'); if (rx) rx.textContent = extra ? brl(extra) : 'nenhum';
  const rvR = $('#pc_comissao_rs'); if (rvR) rvR.textContent = brl(comissaoR);
  const wrapReceita = $('#pc_receita_wrap'); if (wrapReceita) wrapReceita.style.display = regime === 'simples' ? '' : 'none';

  // peso cúbico: fórmula padrão de transportadoras (A×L×C em cm ÷ 6000 = kg).
  // Informativo — não muda o custo de envio, que continua editável.
  const cub = $('#pc_cubagem_hint');
  if (cub) {
    const alt = g('pc_altura'), larg = g('pc_largura'), comp = g('pc_comprimento'), peso = g('pc_peso');
    if (alt && larg && comp) {
      const pesoCubico = (alt * larg * comp) / 6000;
      const considerado = Math.max(peso, pesoCubico);
      cub.textContent = `Peso cúbico: ${pesoCubico.toFixed(2)}kg — peso considerado pela transportadora: ${considerado.toFixed(2)}kg`;
    } else {
      cub.textContent = '';
    }
  }

  const impostoInput = $('#pc_imposto');
  if (impostoInput) {
    impostoInput.disabled = regime === 'simples';
    if (regime === 'simples') impostoInput.value = impostoPct.toFixed(2);
  }

  const o = $('#kout'); if (!o) return;
  const faltando = !venda || !compra;
  const cor = lucro > 0 ? 'var(--up)' : 'var(--dn)';

  o.innerHTML = `
    <div class="stat"><div class="k">Margem líquida</div>
      <div class="v" style="color:${cor}">${margemLiquida!=null?pct(margemLiquida):'—'}</div></div>
    <div class="stat"><div class="k">Lucro líquido</div>
      <div class="v" style="color:${cor}">${brl(lucro)}</div></div>
    ${faltando?`<div class="cwarn">⚠️ Preencha preço de venda e preço de compra pra ter a margem líquida correta.</div>`:''}
    <details class="cdet" style="margin-top:6px"><summary style="cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink-2);padding:10px 0">Cálculo detalhado</summary>
      <div class="grp">Margem bruta</div>
      <div class="row"><span>Margem bruta</span><b>${margemBruta!=null?pct(margemBruta):'—'}</b></div>
      <div class="row"><span>Receita bruta</span><b>${brl(receitaBruta)}</b></div>

      <div class="grp">Por unidade</div>
      <div class="row"><span>Despesas totais</span><b class="neg">−${brl(despesas)}</b></div>
      <div class="row"><span>Receita (lucro líquido)</span><b style="color:${cor}">${brl(lucro)}</b></div>

      <div class="grp">Incluindo todas as vendas do mês</div>
      <div class="row"><span>Vendas mensais</span><b>${num(qtd)}</b></div>
      <div class="row"><span>Despesas totais</span><b class="neg">−${brl(despesas*qtd)}</b></div>
      <div class="row"><span>Receita (lucro líquido)</span><b style="color:${cor}">${brl(lucro*qtd)}</b></div>

      <div class="grp">Todas as despesas (por unidade)</div>
      <div class="row"><span>Preço de compra</span><b class="neg">−${brl(compra)}</b></div>
      <div class="row"><span>Comissão (${comissaoPct}%)</span><b class="neg">−${brl(comissaoR)}</b></div>
      ${taxaFixa?`<div class="row"><span>Taxa fixa</span><b class="neg">−${brl(taxaFixa)}</b></div>`:''}
      <div class="row"><span>Frete</span><b class="neg">−${brl(freteUn)}</b></div>
      <div class="row"><span>Impostos (${impostoPct.toFixed(2)}%)</span><b class="neg">−${brl(impostoR)}</b></div>
      <div class="row"><span>Custos adicionais</span><b class="neg">−${brl(extra)}</b></div>
    </details>`;
}

const CALC_IDS = ['pc_venda','pc_compra','pc_vendas','pc_comissao','pc_taxafixa','pc_taxafixa_v',
  'pc_peso','pc_altura','pc_largura','pc_comprimento','pc_reput','pc_frete',
  'pc_regime','pc_receita','pc_imposto','pc_extra'];
const CALC_RADIOS = ['pc_tipo','pc_gratis'];

function aplicarPresetCalc(p){
  // Não chama render() aqui de propósito: V.calc() gera o HTML com os
  // valores padrão fixos do template, então re-renderizar depois de
  // setar os campos apagaria a predefinição que acabou de ser carregada.
  // O DOM da view calc já existe (é daí que veio o clique), então só
  // precisa atualizar os campos e recalcular.
  CALC_IDS.forEach(id => {
    const el = document.getElementById(id); const v = p.campos[id];
    if (el && v !== undefined) el.type === 'checkbox' ? (el.checked = v) : (el.value = v);
  });
  CALC_RADIOS.forEach(name => {
    const v = p.campos[name];
    if (v === undefined) return;
    const r = document.querySelector(`input[name=${name}][value=${v}]`);
    if (r) r.checked = true;
  });
  calc();
}
function salvarPresetCalc(){
  const nome = prompt('Nome da predefinição:');
  if (!nome) return;
  const campos = {};
  CALC_IDS.forEach(id => { const el = document.getElementById(id); if (el) campos[id] = el.type==='checkbox' ? el.checked : el.value; });
  CALC_RADIOS.forEach(name => { campos[name] = document.querySelector(`input[name=${name}]:checked`)?.value; });
  const presets = presetsCalc();
  presets.push({ nome, campos });
  localStorage.setItem('gr_calc_presets', JSON.stringify(presets));
  render();
}
function excluirPresetCalc(i){
  const presets = presetsCalc();
  presets.splice(i, 1);
  localStorage.setItem('gr_calc_presets', JSON.stringify(presets));
  render();
}
/** Busca ao vivo no Mercado Livre — usado quando o produto ainda não
 *  está na nossa base. Cobre link de catálogo sempre; anúncio direto de
 *  outro vendedor pode vir bloqueado (ver ml-preco, o ML restringe
 *  esse tipo de consulta pra terceiro). */
async function buscarPrecoAoVivo(ref){
  const { data, error } = await sb.functions.invoke('ml-preco', { body: { ref } });
  if (error) return { ok:false, erro: error.message };
  return data;
}

async function aplicarLinkCalc(){
  const el = $('#pc_link'); const ref = el?.value.trim();
  if (!ref) return;
  const btn = $('#pc_aplicar'); if (btn) { btn.disabled = true; btn.textContent = '...'; }
  try {
    const { data, error } = await sb.rpc('buscar_por_referencia', { p_ref: ref });
    if (error) { alert(error.message); return; }
    if (data.tipo === 'texto') { alert('Não reconheci isso como link ou código de produto do Mercado Livre.'); return; }

    if (data.tipo !== 'nao_encontrado') {
      const { data: ficha, error: e2 } = await sb.rpc('ficha_produto', { p_produto: data.produto });
      const preco = !e2 && ficha ? (ficha.concorrencia?.preco_mediano ?? ficha.preco?.preco_atual ?? null) : null;
      if (preco != null) {
        const v = $('#pc_venda'); if (v) v.value = preco;
        calc();
        return;
      }
      // achou o produto na nossa base, mas sem preço coletado ainda —
      // tenta ao vivo antes de desistir.
    }

    const vivo = await buscarPrecoAoVivo(ref);
    if (vivo.ok && vivo.preco != null) {
      const v = $('#pc_venda'); if (v) v.value = vivo.preco;
      calc();
      return;
    }
    if (vivo.ok && vivo.preco == null) {
      alert(`Achei "${vivo.nome ?? data.mlb ?? ref}" no Mercado Livre, mas não consegui um preço agora — preencha manualmente.`);
      return;
    }
    if (vivo.erro === 'bloqueado_ou_nao_encontrado') {
      alert(`${data.mlb ?? ref}: o Mercado Livre bloqueia consulta a anúncio de terceiro desse tipo — preencha o preço manualmente, ou peça a coleta pela extensão.`);
      return;
    }
    alert(`Não consegui achar "${ref}" — nem na nossa base, nem ao vivo no Mercado Livre.`);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Aplicar'; }
  }
}

function blocoExemploVideo(){

// ---------------------------------------------------------------------
// ASSISTENTE — responde com os dados reais da conta (monitorados,
// alertas, quota, e o produto aberto quando houver). A Edge Function
// consome a quota ai_content ANTES de chamar a IA, pra nunca gastar
// chamada de API num pedido que o plano já não permite.
// ---------------------------------------------------------------------
function renderAssist(){
  const panel = $('#assistPanel'); if (!panel) return;
  panel.classList.toggle('hide', !S.assistOpen);
  const box = $('#assistMsgs'); if (!box) return;
  box.innerHTML = (S.assistMsgs.length ? S.assistMsgs.map(m =>
      `<div class="amsg ${m.role}">${esc(m.texto)}</div>`).join('')
    : `<div class="amsg ai">Oi! Pergunte sobre os produtos que você monitora, um alerta, ou o que uma
        métrica da tela significa.</div>`)
    + (S.assistBusy ? `<div class="amsg ai busy">pensando…</div>` : '');
  box.scrollTop = box.scrollHeight;
}

async function enviarPerguntaAssistente(){
  const el = $('#assistInput'); const pergunta = el?.value.trim();
  if (!pergunta || S.assistBusy) return;
  el.value = '';
  S.assistMsgs.push({ role:'user', texto: pergunta });
  S.assistBusy = true; renderAssist();

  const contexto = (S.view === 'detalhe' && S.detalhe?.produto?.product_id)
    ? { produtoId: S.detalhe.produto.product_id } : {};

  try {
    const { data, error } = await sb.functions.invoke('assistente', { body: { pergunta, contexto } });
    if (error || !data?.ok) {
      S.assistMsgs.push({ role:'erro', texto: data?.erro === 'quota'
        ? 'Sua quota de IA deste mês acabou. Veja os planos em Assinatura.'
        : 'Não consegui responder agora. Tenta de novo em um instante.' });
    } else {
      S.assistMsgs.push({ role:'ai', texto: data.resposta });
    }
  } catch {
    S.assistMsgs.push({ role:'erro', texto:'Não consegui responder agora. Tenta de novo em um instante.' });
  } finally {
    S.assistBusy = false; renderAssist();
  }
}

/** Baixa o resultado em CSV. Só as linhas visíveis — exportar o que
 *  está borrado seria burlar o próprio limite. */
function exportarCsv(){
  const lim = S.quota?.features?.rows_full;
  const livres = (lim?.unlimited || lim?.limit === -1) ? S.produtos.length : (lim?.limit ?? 5);
  const linhas = S.produtos.slice(0, livres);
  if (!linhas.length) return;

  const cab = ['produto_id','nome','categoria','posicao','melhor_posicao',
               'movimento_7d','movimento_30d','dias_top10','dias_observados',
               'concorrentes','vendedores','preco_min','preco_mediano','preco_max','full_share'];
  const linha = (p) => [p.product_id,p.name,p.category_name,p.position_now,p.best_position,
    p.delta_7d,p.delta_30d,p.days_in_top10,p.days_observed,p.listings,p.sellers,
    p.min_price,p.median_price,p.max_price,p.full_share]
    .map(v => v==null ? '' : `"${String(v).replace(/"/g,'""')}"`).join(';');

  const csv = '\uFEFF' + [cab.join(';'), ...linhas.map(linha)].join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8' }));
  a.download = `gringa-radar-${new Date().toISOString().slice(0,10)}.csv`;
  a.click(); URL.revokeObjectURL(a.href);
}

const vI = id => { const v = parseInt($('#'+id)?.value); return Number.isFinite(v)?v:null; };
const vF = id => { const v = parseFloat($('#'+id)?.value); return Number.isFinite(v)?v:null; };
const vT = id => $('#'+id)?.value.trim() || null;

/** Lê a tela e monta o objeto de filtros que vai para a RPC. */
function lerFiltros(){
  const F = {
    ...S.F,
    p_categoria:    S.catSel?.id ?? null,
    p_texto:        vT('f_txt'),
    p_pos_min:      vI('f_pmin'),
    p_pos_max:      vI('f_pmax'),
    p_melhor_pos:   vI('f_best'),
    p_preco_min:    vF('f_vmin'),
    p_preco_max:    vF('f_vmax'),
    p_momentum:     vT('f_mov'),
    p_delta_min:    vI('f_delta'),
    p_top10_min:    vI('f_top10'),
    p_conc_min:     vI('f_cmin'),
    p_conc_max:     vI('f_cmax'),
    p_dispersao_min:vF('f_disp'),
    p_ordem:        vT('f_ord') || S.F.p_ordem || 'posicao',
  };
  if (document.getElementById('f_semfull')) {
    F.p_full_max = $('#f_semfull').checked ? 0.3 : null;
    F.p_full_min = $('#f_comfull').checked ? 0.7 : null;
    const ofi = document.querySelector('input[name=ofi]:checked');
    F.p_oficial_max = ofi && ofi.value ? parseFloat(ofi.value) : null;
  }
  Object.keys(F).forEach(k => { if (F[k]===null||F[k]==='') delete F[k]; });
  return F;
}

async function abrir(id){
  let p = S.produtos.find(x=>x.product_id===id);
  $('#sheet').innerHTML='<div class="load">carregando produto…</div>';
  const chamadas = [
    sb.rpc('historico_produto',{p_produto:id}),
    sb.rpc('concorrentes_produto',{p_produto:id}),
  ];
  // Aberto direto do Monitor (sem ter passado pela Busca antes): S.produtos
  // está vazio ou é de outra busca. ficha_produto busca o resumo de verdade
  // em vez de mostrar a página quase em branco.
  if (!p) chamadas.push(sb.rpc('ficha_produto', { p_produto: id }));
  const [h, c, f] = await Promise.all(chamadas);
  if (!p && f?.data) {
    const fp = f.data.produto ?? {}; const r = f.data.ranking ?? {}; const k = f.data.concorrencia ?? {};
    p = {
      product_id: id, name: fp.nome, picture: fp.imagem, permalink: fp.link,
      category_name: fp.categoria, brand: fp.marca,
      position_now: r.position_now, best_position: r.best_position,
      days_in_top10: r.days_in_top10, days_observed: r.days_observed,
      median_price: k.preco_mediano, min_price: k.preco_minimo, max_price: k.preco_maximo,
      listings: k.anuncios, category_id: fp.categoria_id,
    };
  }
  S.detalhe = { produto:p ?? {product_id:id}, historico:h.data ?? [], concorrentes:c.data ?? [] };
  S.detalheAba = 'catalogo'; S.similares = []; S.similaresCarregado = false;
  S.view='detalhe'; render();
}

function render(){
  document.querySelectorAll('.item,.solo').forEach(b =>
    b.setAttribute('aria-current', String(b.dataset.v===S.view)));
  $('#sheet').innerHTML = (V[S.view] ?? V.home)();
  pintaQuota();
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { S.view=b.dataset.go; render(); });
  if (S.view==='produtos'){
    if ($('#b_go')) $('#b_go').onclick = buscar;
    if ($('#b_ref')) $('#b_ref').onclick = localizar;
    if ($('#f_ref')) $('#f_ref').onkeydown = (e) => { if (e.key==='Enter') localizar(); };
    if ($('#b_cl')) $('#b_cl').onclick = () => {
      S.F={}; S.pred=null; S.catSel=null; S.catLista=[]; S.ref=''; S.refAviso=null;
      S.buscou=false; S.produtos=[]; S.contagem=null; S.sel=null; render(); };

    document.querySelectorAll('.mb').forEach(b => b.onclick = () => { S.modo=b.dataset.md; S.sel=null; render(); });

    document.querySelectorAll('.pd').forEach(b => b.onclick = () => {
      const p = PREDEF.find(x=>x.k===b.dataset.pd);
      if (S.pred===p.k){ S.pred=null; S.F={}; } else { S.pred=p.k; S.F={ ...p.f }; }
      render(); contar(); });

    // faixas rápidas de preço e posição
    document.querySelectorAll('[data-pf]').forEach(b => b.onclick = () => {
      const [a,z] = b.dataset.pf.split('|');
      S.F = { ...S.F, ...lerFiltros() };
      S.F.p_preco_min = a?parseFloat(a):undefined; S.F.p_preco_max = z?parseFloat(z):undefined;
      Object.keys(S.F).forEach(k=>{ if(S.F[k]===undefined) delete S.F[k]; });
      render(); contar(); });
    document.querySelectorAll('[data-rf]').forEach(b => b.onclick = () => {
      const [a,z] = b.dataset.rf.split('|');
      S.F = { ...S.F, ...lerFiltros() };
      S.F.p_pos_min = a?parseInt(a):undefined; S.F.p_pos_max = z?parseInt(z):undefined;
      Object.keys(S.F).forEach(k=>{ if(S.F[k]===undefined) delete S.F[k]; });
      render(); contar(); });

    // seletores semânticos da pesquisa simples
    document.querySelectorAll('[data-sem]').forEach(b => b.onclick = (e) => {
      e.stopPropagation();
      S.sel = S.sel===b.dataset.sem ? null : b.dataset.sem; render(); });
    document.querySelectorAll('[data-sv]').forEach(b => b.onclick = () => {
      const [campo,valor] = b.dataset.sv.split('|');
      S.F = { ...S.F, ...lerFiltros() };
      S.F[campo] = S.F[campo]===valor ? undefined : valor;
      if (S.F[campo]===undefined) delete S.F[campo];
      S.sel = null; render(); contar(); });
    document.addEventListener('click', () => { if (S.sel){ S.sel=null; render(); } }, { once:true });

    const ci = $('#f_cat');
    if (ci){ let t;
      ci.onfocus = async () => {
        if (S.catAberto) return;
        S.catAberto = true;
        await carregarNivelCategoria(null);
        render();
        const n = $('#f_cat'); if (n) n.focus();
      };
      ci.oninput = () => { clearTimeout(t); t=setTimeout(async () => {
        await acharCategorias(ci.value.trim());
        const pos = ci.selectionStart; render();
        const n = $('#f_cat'); if (n){ n.focus(); n.value = ci.value; n.setSelectionRange(pos,pos); }
      }, 280); }; }
    const cw = document.querySelector('.catwrap');
    if (cw) cw.onclick = e => e.stopPropagation();
    if (S.catAberto) document.addEventListener('click', () => {
      S.catAberto = false; S.catLista = []; render();
    }, { once:true });
    document.querySelectorAll('[data-toggle]').forEach(b => b.onclick = async () => {
      const id = b.dataset.toggle;
      if (S.catAbertos.has(id)) { S.catAbertos.delete(id); render(); return; }
      S.catAbertos.add(id);
      await carregarNivelCategoria(id);
      render();
    });
    document.querySelectorAll('[data-cid]').forEach(b => b.onclick = () => {
      S.catSel = { id:b.dataset.cid, nome:b.dataset.cn };
      S.catLista=[]; S.catAberto=false; S.F.p_categoria = b.dataset.cid; render(); contar(); });
    if ($('#catx')) $('#catx').onclick = () => {
      S.catSel=null; delete S.F.p_categoria; render(); contar(); };

    ['f_txt','f_pmin','f_pmax','f_best','f_vmin','f_vmax','f_mov','f_delta','f_top10',
     'f_cmin','f_cmax','f_disp','f_semfull','f_comfull'].forEach(id => {
      const e = document.getElementById(id); if (!e) return;
      e.addEventListener('change', () => { S.F = lerFiltros(); contar(); }); });
    document.querySelectorAll('input[name=ofi]').forEach(r =>
      r.addEventListener('change', () => { S.F = lerFiltros(); contar(); }));

    if ($('#f_ord')) $('#f_ord').onchange = () => {
      S.F.p_ordem = $('#f_ord').value; if (S.buscou) buscar(); };

    if ($('#b_tog')) $('#b_tog').onclick = () => { S.filtrosAbertos=!S.filtrosAbertos; render(); };
    if ($('#b_exp')) $('#b_exp').onclick = exportarCsv;
    if ($('#b_lote')) $('#b_lote').onclick = monitorarLote;
    if ($('#b_nada')) $('#b_nada').onclick = () => { S.selecao.clear(); render(); };

    document.querySelectorAll('[data-per]').forEach(b => b.onclick = () => {
      S.periodo = b.dataset.per; render(); });

    document.querySelectorAll('[data-rmf]').forEach(b => b.onclick = () => {
      const k = b.dataset.rmf;
      if (k==='pos'){ delete S.F.p_pos_min; delete S.F.p_pos_max; }
      else if (k==='preco'){ delete S.F.p_preco_min; delete S.F.p_preco_max; }
      else if (k==='conc'){ delete S.F.p_conc_min; delete S.F.p_conc_max; }
      else if (k==='p_categoria'){ S.catSel=null; delete S.F.p_categoria; }
      else delete S.F[k];
      S.pred=null; render(); contar(); });

    document.querySelectorAll('[data-ck]').forEach(c => c.onclick = (ev) => {
      ev.stopPropagation();
      c.checked ? S.selecao.add(c.dataset.ck) : S.selecao.delete(c.dataset.ck);
      render(); });
    if ($('#ck_all')) $('#ck_all').onclick = (ev) => {
      ev.stopPropagation();
      const lim = S.quota?.features?.rows_full;
      const livres = (lim?.unlimited || lim?.limit === -1) ? S.produtos.length : (lim?.limit ?? 5);
      if (ev.target.checked) S.produtos.slice(0,livres).forEach(p => S.selecao.add(p.product_id));
      else S.selecao.clear();
      render(); };

    document.querySelectorAll('tr.k').forEach(tr => tr.onclick = (ev) => {
      if (ev.target.tagName === 'INPUT') return;
      abrir(tr.dataset.p); });
  }
  if (S.view==='categorias' && $('#c_go')) $('#c_go').onclick = cats;
  if (S.view==='locais'){
    if ($('#l_go')) $('#l_go').onclick = buscarLocais;
    document.querySelectorAll('[data-unl]').forEach(b =>
      b.onclick = () => desbloquear(b.dataset.unl));
  }
  if (S.view==='monitor'){
    document.querySelectorAll('.tb').forEach(b => b.onclick = () => { S.aba=b.dataset.ab; render(); });
    document.querySelectorAll('[data-seg]').forEach(b => b.onclick = async () => { b.disabled=true; b.textContent='...'; await seguir(b.dataset.seg); await carregarMonitor(); S.aba='lista'; render(); });
    document.querySelectorAll('[data-rm]').forEach(b => b.onclick = (ev) => { ev.stopPropagation(); largar(b.dataset.rm); });
    document.querySelectorAll('tr.k[data-p]').forEach(tr => tr.onclick = () => abrir(tr.dataset.p));
    document.querySelectorAll('[data-rmped]').forEach(b => b.onclick = () => removerPedido(b.dataset.rmped));
    if ($('#lidos')) $('#lidos').onclick = async () => {
      await sb.rpc('marcar_alertas_lidos'); await carregarMonitor(); render(); };
    if ($('#v_busca')){
      $('#v_busca').oninput = (e) => { S.vendBusca = e.target.value; };
      $('#v_busca').addEventListener('keydown', (e) => { if (e.key==='Enter') buscarVendedores(); });
    }
    if ($('#v_ir')) $('#v_ir').onclick = buscarVendedores;
    document.querySelectorAll('[data-vadd]').forEach(b => b.onclick = () => acompanharVendedor(Number(b.dataset.vadd)));
    document.querySelectorAll('[data-vrm]').forEach(b => b.onclick = () => largarVendedor(Number(b.dataset.vrm)));
  }
  if (S.view==='detalhe'){
    if ($('#volta')) $('#volta').onclick = () => { S.view='produtos'; render(); };
    if ($('#mon')) $('#mon').onclick = () => {
      const id = S.detalhe.produto.product_id;
      S.monitorados.some(m=>m.product_id===id) ? largar(id) : seguir(id); };
    document.querySelectorAll('[data-dab]').forEach(b => b.onclick = async () => {
      S.detalheAba = b.dataset.dab;
      if (S.detalheAba === 'similares' && !S.similaresCarregado) { await carregarSimilares(); }
      render();
    });
    document.querySelectorAll('tr[data-open]').forEach(tr => tr.onclick = () => window.open(tr.dataset.open, '_blank'));
    document.querySelectorAll('#sheet tr.k[data-p]').forEach(tr => tr.onclick = () => abrir(tr.dataset.p));
  }
  if (S.view==='calc'){
    ['pc_venda','pc_compra','pc_vendas','pc_comissao','pc_taxafixa','pc_taxafixa_v',
     'pc_peso','pc_altura','pc_largura','pc_comprimento','pc_reput','pc_frete',
     'pc_regime','pc_receita','pc_imposto','pc_extra']
      .forEach(id => document.getElementById(id)?.addEventListener('input', calc));
    document.querySelectorAll('input[name=pc_gratis]').forEach(r => r.addEventListener('change', calc));
    document.querySelectorAll('input[name=pc_tipo]').forEach(r => r.addEventListener('change', () => {
      const co = $('#pc_comissao'); if (co) co.value = COMISSAO_PADRAO[r.value] ?? co.value;
      calc();
    }));
    if ($('#pc_faixa')) $('#pc_faixa').onchange = () => {
      const rc = $('#pc_receita'); if (rc) rc.value = $('#pc_faixa').value;
      calc();
    };
    if ($('#pc_calc')) $('#pc_calc').onclick = calc;
    if ($('#pc_limpar')) $('#pc_limpar').onclick = () => { S.calcCats = []; render(); };
    if ($('#pc_salvar')) $('#pc_salvar').onclick = salvarPresetCalc;
    if ($('#pc_aplicar')) $('#pc_aplicar').onclick = aplicarLinkCalc;
    if ($('#pc_cat_addbtn')) $('#pc_cat_addbtn').onclick = () => {
      const el = $('#pc_cat_add'); const v = el?.value.trim();
      if (v) { S.calcCats.push(v); render(); }
    };
    document.querySelectorAll('[data-catdel]').forEach(b => b.onclick = () => {
      S.calcCats.splice(Number(b.dataset.catdel), 1); render(); });
    const presets = presetsCalc();
    document.querySelectorAll('[data-loadp]').forEach(b => b.onclick = () => aplicarPresetCalc(presets[Number(b.dataset.loadp)]));
    document.querySelectorAll('[data-delp]').forEach(b => b.onclick = () => excluirPresetCalc(Number(b.dataset.delp)));
    calc();
  }
  if (S.view==='clipes'){
    document.querySelectorAll('[data-clv]').forEach(b => b.onclick = () => {
      S.clipesVista = b.dataset.clv || null; S.clipesAdd = false; render();
    });
    document.querySelectorAll('[data-cladd]').forEach(b => b.onclick = () => {
      S.clipesAdd = true; render();
      const el = $('#cl_add_ref'); if (el) el.focus();
    });
    document.querySelectorAll('[data-clrm]').forEach(b => b.onclick = () => {
      S.clipesProdutos[S.clipesVista].splice(Number(b.dataset.clrm), 1); render();
    });
    if ($('#cl_add_ok')) $('#cl_add_ok').onclick = adicionarProdutoClipes;
    const clRef = $('#cl_add_ref');
    if (clRef) clRef.addEventListener('keydown', (e) => { if (e.key==='Enter') adicionarProdutoClipes(); });
  }
  if (S.view==='assinatura'){
    if (!S.planos.length) carregarPlanos().then(render);
    if ($('#pl_toggle')) $('#pl_toggle').onclick = () => {
      S.periodoPlano = S.periodoPlano === 'ano' ? 'mes' : 'ano'; render();
    };
  }
  window.scrollTo(0,0);
}

document.querySelectorAll('.item,.solo').forEach(b =>
  b.onclick = () => { S.view = b.dataset.v; render(); });
document.querySelectorAll('.gh').forEach(h => h.onclick = () => {
  document.getElementById(h.dataset.g).classList.toggle('hide');
});

sb.auth.getSession().then(({data}) => {
  if (data.session){ $('#gate').classList.add('hide'); $('#app').classList.remove('hide'); boot(); }
});
</script>
