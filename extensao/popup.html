<!doctype html>
<meta charset="utf-8">
<title>Gringa Radar — Entrar</title>
<style>
  body{margin:0;width:320px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:14px;color:#1A1A1E;background:#fff}
  .p{padding:18px 18px 16px}
  .m{display:flex;align-items:center;gap:9px;margin-bottom:6px}
  .m b{font-size:15px;font-weight:700;letter-spacing:-.02em}
  .m b i{color:#7C3AED;font-style:normal}
  .tag{display:inline-block;font-size:10.5px;font-weight:700;color:#6D28D9;background:#F5F3FF;
    padding:2px 8px;border-radius:99px;margin-bottom:14px;letter-spacing:.02em}
  h1{font-size:17px;font-weight:700;letter-spacing:-.02em;margin:0 0 6px}
  .lead{font-size:12.5px;color:#4B5563;line-height:1.45;margin:0 0 14px}
  label{display:block;font-size:12px;font-weight:500;color:#4B5563;margin:12px 0 4px}
  input{width:100%;padding:9px 10px;border:1px solid #E8EAEF;border-radius:8px;font-size:13.5px;box-sizing:border-box}
  input:focus{outline:none;border-color:#7C3AED}
  button{width:100%;margin-top:14px;background:#7C3AED;color:#fff;border:0;border-radius:8px;
    padding:10px;font-size:13.5px;font-weight:600;cursor:pointer}
  button:hover{background:#6D28D9}
  button:disabled{opacity:.55;cursor:not-allowed}
  button.g{background:#fff;color:#4B5563;border:1px solid #E8EAEF;margin-top:8px}
  .msg{margin-top:12px;padding:9px 11px;border-radius:8px;font-size:12.5px;line-height:1.4}
  .err{background:#FEF2F2;color:#DC2626} .ok{background:#F0FDF4;color:#16A34A}
  .warn{background:#FFFBEB;color:#B45309}
  .quem{font-size:13px;color:#4B5563;margin-bottom:4px}
  .quem b{color:#1A1A1E}
  .chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;
    background:#F0FDF4;color:#16A34A;margin:8px 0 4px}
  .chip.off{background:#FEF2F2;color:#DC2626}
  .dica{font-size:12px;color:#8A93A0;line-height:1.5;margin-top:12px}
  .dica a{color:#7C3AED;font-weight:500;text-decoration:none}
  .linha{height:1px;background:#E8EAEF;margin:14px 0}
</style>
<div class="p">
  <div class="m">
    <svg width="26" height="26" viewBox="0 0 56 56" aria-hidden="true">
      <circle cx="28" cy="28" r="23" fill="none" stroke="#7C3AED" stroke-width="4"/>
      <path d="M28 28 L46 12" stroke="#7C3AED" stroke-width="4" stroke-linecap="round"/>
      <circle cx="28" cy="28" r="4" fill="#7C3AED"/></svg>
    <b>Gringa <i>Radar</i></b>
  </div>
  <div id="area"></div>
</div>
<script src="popup.js"></script>
